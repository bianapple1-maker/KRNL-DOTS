
# ==========================================
# KRNL HYPRLOCK
# Theme: FOGGY MISTY FOREST
# Arch Linux | Hyprland
# ==========================================

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    disable_loading_bar = true
    grace = 0
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    noise = 0.015
    contrast = 0.95
    brightness = 0.75
    vibrancy = 0.08
    vibrancy_darkness = 0.2
}

# CLOCK
label {
    monitor =
    text = $TIME
    color = rgba(e4e9e9ff)
    font_size = 105
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(b8c5c5ff)
    font_size = 16
    font_family = $font
    position = 0, 15
    halign = center
    valign = center
}

# USERNAME
label {
    monitor =
    text = 󰀄  krnl
    color = rgba(d0dadaff)
    font_size = 17
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 310, 52
    outline_thickness = 1

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(a9b8b899)
    inner_color = rgba(18202020)
    font_color = rgba(e4e9e9ff)

    fade_on_empty = false
    rounding = 8

    placeholder_text = Enter password...
    fail_text = Authentication failed
    hide_input = false

    check_color = rgba(b8d0c0ff)
    fail_color = rgba(d08080ff)
    capslock_color = rgba(d8c58aff)

    position = 0, -155
    halign = center
    valign = center
}
