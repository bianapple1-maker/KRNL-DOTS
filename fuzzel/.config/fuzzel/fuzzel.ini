# Fog Forest - Fuzzel
# Solid charcoal surfaces + matching fog-beige accent

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="⌕  "
placeholder="Search applications"
icons-enabled=yes
icon-theme=Papirus-Dark
fields=name,generic,comment,filename,keywords
terminal=foot
layer=overlay
width=42
lines=10
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=28
letter-spacing=0
exit-on-keyboard-focus-loss=yes

[colors]
background=252b30ff
text=e2e0d8ff
prompt=d2d0c6ff
placeholder=aaa9a1ff
input=e2e0d8ff
match=d2d0c6ff
selection=d2d0c6ff
selection-text=252b30ff
selection-match=252b30ff
border=596168ff

[border]
width=1
radius=4

[dmenu]
exit-immediately-if-empty=no
